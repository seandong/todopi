# 发布：推送 v<version> 标签时构建 npm 包与四个平台的单二进制，生成 SHA256SUMS，建 GitHub Release 并附上。
# install.sh 从这里取二进制（/releases/latest 与 /releases/download/v<version>/...）。
# 发 npm 需要仓库 secret NPM_TOKEN；没有就整个失败（先发 npm 再建 Release，见下）。发布是维护者的动作。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 只放「有没有」这个布尔值，不放 token 本身：job 级 env 每一步都看得见，npm ci 的依赖装包脚本也读得到（F34 评审）。
      # token 只注入更新 tap 的那一步。没有就跳过那一步（formula 仍作为 Release 资产附上，见 docs/brew.md）
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build
        run: |
          npm ci
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p out build
          npm pack --pack-destination out
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target=bun-$t src/main.ts --outfile build/$t/todopi
            tar -czf out/todopi-$VERSION-$t.tar.gz -C build/$t todopi
          done
          (cd out && sha256sum todopi-$VERSION-*.tar.gz > SHA256SUMS)
          # Homebrew formula：四个平台的地址与 sha256 都取自刚算的 SHA256SUMS（F34）
          node tools/brew/formula.mjs "$VERSION" out/SHA256SUMS > out/todopi.rb
      # 先发 npm，再建 Release：install.sh 在有 Node 的机器上装 todopi@<version>，Release 出现而 npm 上没有这个版本时，
      # 那些机器会拿到 404（F21 评审）。所以没有 NPM_TOKEN、或发布失败，整个任务失败、不建 Release。
      # 标签在构建期间被删、被移走，都不发：发出去的必须正是这个标签指向的提交（v0.1.0 重打标签时的评审）
      - name: Tag still points at this commit
        run: |
          # 附注标签取解引用后的那一行（^{}），轻量标签只有一行
          remote=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" \
            | awk '{s=$1} $2 ~ /\^\{\}$/ {p=$1} END {print (p != "" ? p : s)}')
          test "$remote" = "$GITHUB_SHA" || { echo "tag $GITHUB_REF_NAME points at ${remote:-nothing}, not $GITHUB_SHA; not releasing"; exit 1; }
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # 路径必须以 ./ 开头：out/x.tgz 这种「名字/名字」会被 npm 当成 GitHub 简写、去 ssh 拉 github.com/out/x.tgz（v0.1.0 首发时实测，tp-ornltg）
          TGZ=./out/todopi-$VERSION.tgz
          # 重跑时（npm 已发、之后的步骤失败）不再发：同一版本发第二次必然失败。但只有 npm 上那一份**就是这次打出的包**才跳过——
          # 否则别人抢先发了同名同版本，Release 就会让 install.sh 的 Node 路径装上别人的包（评审 P1）。npm pack 的输出是确定的
          # （文件时间戳固定），同一个提交重跑打出的包 integrity 相同。
          published=$(npm view "todopi@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$published" ]; then
            ours="sha512-$(openssl dgst -sha512 -binary "$TGZ" | openssl base64 -A)"
            if [ "$published" = "$ours" ]; then echo "todopi@$VERSION is already on npm and matches this build; skipping publish"; exit 0; fi
            echo "todopi@$VERSION is on npm but is not this build (npm: $published, ours: $ours); not releasing"; exit 1
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set: refusing to create a release that npm does not have"; exit 1; fi
          npm publish "$TGZ" --access public
      # --verify-tag：标签不在就失败，而不是让 gh 在默认分支的最新提交上自己建一个（评审 P2）。
      # Release 已在（上次在它之后的步骤失败、整个任务重跑）：以已发布的为准，一个字节都不改。二进制的 tar.gz 每次构建都带新的
      # 时间戳，重建出来的和已发布的本来就不同；覆盖（--clobber 还会先删后传，中途失败留下残缺的 Release，评审 P1）只会让
      # SHA256SUMS、formula 与资产对不上。所以资产齐全就把它们取回 out/，后面的 tap 用的是 Release 自己的 formula；不齐就失败，交给人。
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in out/*; do
            name=$(basename "$f")
            printf '%s\n' "$existing" | grep -qxF "$name" \
              || { echo "release $GITHUB_REF_NAME exists but has no $name; finish it by hand (docs/brew.md) instead of mixing builds"; exit 1; }
          done
          rm -rf out && mkdir out
          gh release download "$GITHUB_REF_NAME" --dir out
          echo "release $GITHUB_REF_NAME already published; using its assets"
      # tap 在 Release 之后更新：formula 里的地址指向 Release 资产，先有资产再让 brew 用户看到新版本
      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/seandong/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/todopi.rb tap/Formula/todopi.rb
          cd tap
          git config user.name "todopi release"
          git config user.email "release@todopi.invalid"
          git add Formula/todopi.rb
          git diff --cached --quiet || { git commit -m "todopi ${GITHUB_REF_NAME#v}" && git push; }
